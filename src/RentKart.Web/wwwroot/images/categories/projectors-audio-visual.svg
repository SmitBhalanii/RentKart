<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="beamGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#avBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#beamGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Projector & Projection Beam -->
  <g transform="translate(180, 130)">
    <!-- Light Beam Cones -->
    <polygon points="120,130 -30,60 -30,200" fill="#38BDF8" fill-opacity="0.12" />
    <polygon points="120,130 -10,80 -10,180" fill="#2DD4BF" fill-opacity="0.15" />

    <!-- Projector Chassis -->
    <rect x="120" y="80" width="310" height="110" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3" />
    <rect x="110" y="185" width="330" height="12" rx="4" fill="#0F172A" />

    <!-- Lens Optical Assembly -->
    <circle cx="170" cy="135" r="42" fill="#0F172A" stroke="#0D9488" stroke-width="4" />
    <circle cx="170" cy="135" r="32" fill="#1E293B" />
    <circle cx="170" cy="135" r="22" fill="#38BDF8" fill-opacity="0.7" />
    <circle cx="170" cy="135" r="10" fill="#FFFFFF" fill-opacity="0.8" />

    <!-- Vents & Control Buttons -->
    <line x1="240" y1="105" x2="330" y2="105" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="117" x2="330" y2="117" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="129" x2="330" y2="129" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="141" x2="330" y2="141" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="153" x2="330" y2="153" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />

    <circle cx="380" cy="115" r="8" fill="#0D9488" />
    <circle cx="400" cy="115" r="6" fill="#94A3B8" />
    <circle cx="380" cy="135" r="6" fill="#94A3B8" />
    <circle cx="400" cy="135" r="6" fill="#94A3B8" />

    <!-- Feet -->
    <rect x="150" y="195" width="30" height="15" rx="3" fill="#334155" />
    <rect x="360" y="195" width="30" height="15" rx="3" fill="#334155" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-145" y="-35" width="290" height="30" rx="15" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1.5">AUDIO VISUAL &amp; PROJECTORS</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">High-Lumen Displays &amp; PA Sound</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

