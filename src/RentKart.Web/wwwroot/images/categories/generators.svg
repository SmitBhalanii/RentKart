<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="genBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="powerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#genBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#powerGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Inverter Generator Silhouette -->
  <g transform="translate(180, 110)">
    <!-- Carry Handle Top -->
    <path d="M 120 70 L 320 70 L 300 45 L 140 45 Z" fill="#1E293B" stroke="#334155" stroke-width="3" />

    <!-- Red Outer Case -->
    <rect x="60" y="70" width="320" height="230" rx="28" fill="#DC2626" stroke="#EF4444" stroke-width="4" />
    
    <!-- Recoil Start / Side Grille -->
    <circle cx="150" cy="180" r="50" fill="#1E293B" stroke="#0F172A" stroke-width="4" />
    <circle cx="150" cy="180" r="20" fill="#0F172A" />
    <line x1="145" y1="180" x2="155" y2="180" stroke="#F87171" stroke-width="4" />

    <!-- Control Panel Inset -->
    <rect x="240" y="110" width="115" height="150" rx="12" fill="#0F172A" stroke="#334155" stroke-width="3" />
    
    <!-- AC Outlets (Indian standard 230V style socket circles) -->
    <circle cx="270" cy="150" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <circle cx="266" cy="148" r="2.5" fill="#FFFFFF" />
    <circle cx="274" cy="148" r="2.5" fill="#FFFFFF" />
    <circle cx="270" cy="156" r="3" fill="#FFFFFF" />

    <circle cx="315" cy="150" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <circle cx="311" cy="148" r="2.5" fill="#FFFFFF" />
    <circle cx="319" cy="148" r="2.5" fill="#FFFFFF" />
    <circle cx="315" cy="156" r="3" fill="#FFFFFF" />

    <!-- Indicator LEDs (Run/Overload/Oil) -->
    <circle cx="265" cy="195" r="4" fill="#10B981" />
    <circle cx="285" cy="195" r="4" fill="#F59E0B" />
    <circle cx="305" cy="195" r="4" fill="#EF4444" />

    <!-- Circuit Breaker Switch -->
    <rect x="265" y="215" width="22" height="14" rx="3" fill="#EF4444" />
    <rect x="300" y="215" width="35" height="14" rx="3" fill="#334155" />

    <!-- Rubber Feet -->
    <rect x="90" y="300" width="55" height="18" rx="5" fill="#0F172A" />
    <rect x="295" y="300" width="55" height="18" rx="5" fill="#0F172A" />

    <!-- Fuel Cap -->
    <rect x="180" y="55" width="45" height="15" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-140" y="-35" width="280" height="30" rx="15" fill="#EF4444" fill-opacity="0.18" stroke="#EF4444" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F87171" letter-spacing="1.5">GENERATORS &amp; POWER</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Portable Inverters &amp; Site Power</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

