<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="indBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="gearGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#indBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#gearGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Industrial Air Compressor / Heavy Plant Graphic -->
  <g transform="translate(190, 100)">
    <!-- Pressure Vessel Cylinder -->
    <rect x="60" y="160" width="310" height="110" rx="45" fill="#0284C7" stroke="#38BDF8" stroke-width="4" />
    
    <!-- Support Legs -->
    <rect x="90" y="270" width="25" height="40" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <rect x="315" y="270" width="25" height="40" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <circle cx="330" cy="305" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />

    <!-- Compressor Pump & Motor -->
    <rect x="80" y="70" width="100" height="90" rx="10" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <circle cx="130" cy="115" r="30" fill="#1E293B" stroke="#0284C7" stroke-width="3" />
    <line x1="130" y1="90" x2="130" y2="140" stroke="#38BDF8" stroke-width="4" />
    <line x1="105" y1="115" x2="155" y2="115" stroke="#38BDF8" stroke-width="4" />

    <rect x="200" y="85" width="110" height="75" rx="8" fill="#1E293B" stroke="#475569" stroke-width="3" />
    
    <!-- Flywheel Belt Guard -->
    <ellipse cx="140" cy="115" rx="55" ry="40" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8 4" />

    <!-- Pressure Gauge -->
    <circle cx="280" cy="65" r="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <line x1="280" y1="65" x2="290" y2="58" stroke="#EF4444" stroke-width="2.5" />
    <circle cx="280" cy="65" r="3" fill="#0F172A" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-140" y="-35" width="280" height="30" rx="15" fill="#0284C7" fill-opacity="0.18" stroke="#0284C7" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1.5">INDUSTRIAL MACHINERY</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Air Compressors &amp; Plant Equipment</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

