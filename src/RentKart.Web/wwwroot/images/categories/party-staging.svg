<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="partyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#partyBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#stageGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Event Canopy & Stage Truss Silhouette -->
  <g transform="translate(190, 100)">
    <!-- Event Canopy / Tent -->
    <polygon points="210,30 30,120 390,120" fill="#EC4899" stroke="#F472B6" stroke-width="3" />
    <polygon points="210,30 390,120 350,120" fill="#BE185D" />

    <!-- Canopy Valance / Waves -->
    <path d="M 30 120 Q 75 140 120 120 Q 165 140 210 120 Q 255 140 300 120 Q 345 140 390 120 L 390 125 L 30 125 Z" fill="#F472B6" />

    <!-- Aluminum Poles -->
    <line x1="45" y1="125" x2="45" y2="280" stroke="#94A3B8" stroke-width="5" />
    <line x1="375" y1="125" x2="375" y2="280" stroke="#94A3B8" stroke-width="5" />
    <line x1="210" y1="125" x2="210" y2="280" stroke="#CBD5E1" stroke-width="5" />

    <!-- Stage Platform Floor -->
    <polygon points="20,270 400,270 430,300 -10,300" fill="#0F172A" stroke="#334155" stroke-width="3" />
    
    <!-- Stage Lights -->
    <circle cx="110" cy="140" r="10" fill="#FACC15" />
    <polygon points="110,140 60,250 160,250" fill="#FACC15" fill-opacity="0.12" />

    <circle cx="310" cy="140" r="10" fill="#38BDF8" />
    <polygon points="310,140 260,250 360,250" fill="#38BDF8" fill-opacity="0.12" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-130" y="-35" width="260" height="30" rx="15" fill="#EC4899" fill-opacity="0.18" stroke="#EC4899" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F472B6" letter-spacing="1.5">PARTY &amp; STAGING</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Canopies, Trussing &amp; Banquets</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

