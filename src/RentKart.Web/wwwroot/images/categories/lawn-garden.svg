<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="lawnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="grassGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#lawnBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#grassGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Lawn Mower / Garden Machinery Silhouette -->
  <g transform="translate(200, 110)">
    <!-- Main Mower Deck -->
    <path d="M 60 210 C 60 170 120 160 230 160 C 270 160 300 175 310 210 L 60 210 Z" fill="#059669" stroke="#10B981" stroke-width="4" />
    
    <!-- Engine Block -->
    <rect x="140" y="100" width="100" height="70" rx="12" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <line x1="160" y1="120" x2="220" y2="120" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <line x1="160" y1="135" x2="220" y2="135" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    
    <!-- Air Filter / Starter -->
    <rect x="175" y="80" width="30" height="20" rx="4" fill="#334155" />

    <!-- Wheels (Front & Rear) -->
    <!-- Front Wheel -->
    <circle cx="85" cy="230" r="32" fill="#0F172A" stroke="#10B981" stroke-width="4" />
    <circle cx="85" cy="230" r="10" fill="#94A3B8" />
    <!-- Rear Wheel (Bigger) -->
    <circle cx="280" cy="225" r="42" fill="#0F172A" stroke="#10B981" stroke-width="4" />
    <circle cx="280" cy="225" r="14" fill="#94A3B8" />

    <!-- Grass Bag Inset -->
    <path d="M 280 175 L 370 160 L 370 220 L 300 220 Z" fill="#1E293B" stroke="#475569" stroke-width="3" />

    <!-- Handle Bars extending backwards -->
    <line x1="260" y1="160" x2="380" y2="40" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
    <line x1="380" y1="40" x2="350" y2="20" stroke="#10B981" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-140" y="-35" width="280" height="30" rx="15" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34D399" letter-spacing="1.5">GARDENING &amp; LANDSCAPING</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Lawn Mowers, Aerators &amp; Blowers</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

