<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#compBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#screenGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Laptop Workstation Graphic -->
  <g transform="translate(210, 110)">
    <!-- Laptop Screen Display -->
    <rect x="70" y="50" width="240" height="160" rx="12" fill="#0F172A" stroke="#334155" stroke-width="4" />
    <rect x="80" y="60" width="220" height="140" rx="6" fill="#1E293B" />
    <circle cx="190" cy="55" r="3" fill="#60A5FA" />
    
    <!-- Code / Screen Lines Glow -->
    <rect x="95" y="75" width="80" height="8" rx="4" fill="#38BDF8" />
    <rect x="95" y="92" width="130" height="6" rx="3" fill="#64748B" />
    <rect x="95" y="105" width="110" height="6" rx="3" fill="#64748B" />
    <rect x="95" y="118" width="150" height="6" rx="3" fill="#2DD4BF" />
    <rect x="95" y="131" width="90" height="6" rx="3" fill="#64748B" />
    <circle cx="255" cy="155" r="22" fill="#0D9488" fill-opacity="0.4" />
    <polygon points="255,145 265,160 245,160" fill="#2DD4BF" />

    <!-- Laptop Base / Keyboard Deck -->
    <polygon points="40,230 340,230 370,260 10,260" fill="#334155" stroke="#475569" stroke-width="3" />
    <rect x="145" y="240" width="90" height="15" rx="3" fill="#1E293B" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-140" y="-35" width="280" height="30" rx="15" fill="#3B82F6" fill-opacity="0.18" stroke="#3B82F6" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#60A5FA" letter-spacing="1.5">COMPUTERS &amp; LAPTOPS</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Mobile Workstations &amp; Event IT</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

