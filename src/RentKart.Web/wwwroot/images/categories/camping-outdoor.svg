<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="campBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="tentGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#campBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#tentGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Dome Tent Graphic -->
  <g transform="translate(190, 100)">
    <!-- Mountain Background Silhouette -->
    <polygon points="120,240 200,80 270,240" fill="#1E293B" fill-opacity="0.4" />
    <polygon points="200,80 220,120 185,120" fill="#94A3B8" fill-opacity="0.5" />

    <!-- Dome Tent Shell -->
    <path d="M 40 270 C 50 120 350 120 360 270 Z" fill="#0F766E" stroke="#14B8A6" stroke-width="4" />
    
    <!-- Tent Door Flap -->
    <path d="M 140 270 C 150 160 250 160 260 270 Z" fill="#0F172A" stroke="#2DD4BF" stroke-width="3" />
    <path d="M 160 270 C 165 180 200 180 200 270 Z" fill="#1E293B" />
    
    <!-- Crossing Structural Poles -->
    <path d="M 40 270 Q 200 100 360 270" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8 4" />
    
    <!-- Ground Stake Lines -->
    <line x1="40" y1="270" x2="10" y2="295" stroke="#CBD5E1" stroke-width="3" />
    <line x1="360" y1="270" x2="390" y2="295" stroke="#CBD5E1" stroke-width="3" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-135" y="-35" width="270" height="30" rx="15" fill="#14B8A6" fill-opacity="0.18" stroke="#14B8A6" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#2DD4BF" letter-spacing="1.5">CAMPING &amp; EXPEDITION</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Tents, Power Banks &amp; Trekking</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

