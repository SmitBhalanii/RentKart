<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="toolsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="drillGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#toolsBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#drillGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Rotary Hammer / Heavy Drill Silhouette -->
  <g transform="translate(190, 110)">
    <!-- Drill Chuck & Bit -->
    <rect x="20" y="115" width="70" height="20" rx="3" fill="#64748B" />
    <path d="M 0 120 L 20 115 L 20 135 L 0 130 Z" fill="#94A3B8" />
    <line x1="-30" y1="125" x2="0" y2="125" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" />
    <line x1="-30" y1="125" x2="-20" y2="125" stroke="#F59E0B" stroke-width="6" />

    <!-- Chuck collar -->
    <rect x="85" y="105" width="45" height="40" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2" />

    <!-- Gearbox Housing (Industrial Teal / Amber) -->
    <rect x="125" y="95" width="130" height="65" rx="12" fill="#0D9488" stroke="#14B8A6" stroke-width="3" />
    <circle cx="170" cy="127" r="14" fill="#042F2E" />
    <text x="170" y="132" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#2DD4BF" text-anchor="middle">M</text>

    <!-- Motor Housing -->
    <path d="M 255 85 L 360 85 C 380 85 390 100 390 120 L 390 170 C 390 185 375 195 360 195 L 255 185 Z" fill="#0F172A" stroke="#334155" stroke-width="4" />
    <line x1="280" y1="105" x2="360" y2="105" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="280" y1="125" x2="360" y2="125" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="280" y1="145" x2="360" y2="145" stroke="#334155" stroke-width="4" stroke-linecap="round" />

    <!-- Handle & Trigger -->
    <path d="M 320 190 C 330 230 335 270 330 300 C 325 320 305 325 285 320 C 265 315 260 295 265 260 C 270 220 275 200 280 190 Z" fill="#1E293B" stroke="#475569" stroke-width="3" />
    <rect x="255" y="215" width="22" height="35" rx="6" fill="#F59E0B" />

    <!-- Battery Base / Cordless Foot -->
    <rect x="255" y="315" width="110" height="45" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="3" />
    <rect x="270" y="340" width="80" height="8" rx="4" fill="#F59E0B" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-140" y="-35" width="280" height="30" rx="15" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" letter-spacing="1.5">POWER TOOLS &amp; CONSTRUCTION</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Heavy-Duty Drills, Saws &amp; Demolition</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

