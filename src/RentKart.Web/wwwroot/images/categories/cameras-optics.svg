<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="camBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="camGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lensReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#0F766E" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#camBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#camGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Camera Body Silhouette & Details -->
  <g transform="translate(160, 110)">
    <!-- Pentaprism / Viewfinder hump -->
    <path d="M 180 90 L 220 50 L 260 50 L 300 90 Z" fill="#1E293B" stroke="#334155" stroke-width="3" />
    <rect x="230" y="38" width="20" height="12" rx="3" fill="#0D9488" />
    
    <!-- Main Body -->
    <rect x="50" y="90" width="380" height="230" rx="24" fill="#0F172A" stroke="#334155" stroke-width="4" />
    
    <!-- Right Hand Grip -->
    <path d="M 50 110 C 25 130 20 200 35 290 C 42 315 55 320 75 320 L 75 110 Z" fill="#1E293B" stroke="#334155" stroke-width="3" />
    <line x1="38" y1="150" x2="68" y2="150" stroke="#475569" stroke-width="2" />
    <line x1="36" y1="180" x2="68" y2="180" stroke="#475569" stroke-width="2" />
    <line x1="38" y1="210" x2="68" y2="210" stroke="#475569" stroke-width="2" />

    <!-- Top Dials & Shutter -->
    <rect x="80" y="72" width="40" height="18" rx="4" fill="#334155" />
    <circle cx="100" cy="72" r="10" fill="#0D9488" />
    <rect x="350" y="70" width="50" height="20" rx="4" fill="#334155" />

    <!-- Lens Mount & Barrel -->
    <circle cx="240" cy="205" r="115" fill="#1E293B" stroke="#475569" stroke-width="4" />
    <circle cx="240" cy="205" r="95" fill="#0F172A" stroke="#0D9488" stroke-width="3" />
    <circle cx="240" cy="205" r="75" fill="#020617" stroke="#334155" stroke-width="2" />
    
    <!-- Front Glass Element Reflection -->
    <circle cx="240" cy="205" r="60" fill="url(#lensReflect)" />
    <ellipse cx="225" cy="185" rx="35" ry="18" fill="#FFFFFF" opacity="0.35" transform="rotate(-25 225 185)" />

    <!-- Lens Release Button & Sensor Badge -->
    <circle cx="340" cy="250" r="8" fill="#EF4444" />
    <rect x="365" y="115" width="45" height="16" rx="4" fill="#14B8A6" />
    <text x="387" y="127" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#042F2E" text-anchor="middle">PRO 4K</text>
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-130" y="-35" width="260" height="30" rx="15" fill="#0D9488" fill-opacity="0.18" stroke="#0D9488" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#2DD4BF" letter-spacing="1.5">CAMERAS &amp; OPTICS</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Professional Cinema &amp; Photography</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

