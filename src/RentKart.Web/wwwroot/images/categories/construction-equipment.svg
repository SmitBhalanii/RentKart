<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="conBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="mixerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#conBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#mixerGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Concrete Mixer Graphic -->
  <g transform="translate(200, 100)">
    <!-- Stand / Frame -->
    <line x1="80" y1="280" x2="180" y2="170" stroke="#475569" stroke-width="6" />
    <line x1="280" y1="280" x2="180" y2="170" stroke="#475569" stroke-width="6" />
    <line x1="80" y1="280" x2="280" y2="280" stroke="#475569" stroke-width="6" />
    
    <!-- Wheels -->
    <circle cx="80" cy="285" r="28" fill="#0F172A" stroke="#EA580C" stroke-width="4" />
    <circle cx="80" cy="285" r="8" fill="#94A3B8" />

    <!-- Mixer Drum (Tilted) -->
    <g transform="rotate(25 210 160)">
      <!-- Barrel Base -->
      <path d="M 120 180 C 120 240 260 240 260 180 L 260 120 L 120 120 Z" fill="#EA580C" stroke="#C2410C" stroke-width="4" />
      <!-- Cone Opening -->
      <polygon points="120,120 260,120 220,60 160,60" fill="#F97316" stroke="#C2410C" stroke-width="4" />
      <ellipse cx="190" cy="60" rx="30" ry="10" fill="#0F172A" stroke="#EA580C" stroke-width="3" />
      <!-- Ring Gear -->
      <line x1="115" y1="150" x2="265" y2="150" stroke="#1E293B" stroke-width="8" stroke-dasharray="10 5" />
    </g>

    <!-- Motor Box & Tipping Wheel -->
    <rect x="240" y="160" width="55" height="55" rx="8" fill="#1E293B" stroke="#475569" stroke-width="3" />
    <circle cx="320" cy="180" r="22" fill="none" stroke="#EA580C" stroke-width="4" />
    <line x1="320" y1="158" x2="320" y2="202" stroke="#EA580C" stroke-width="3" />
    <line x1="298" y1="180" x2="342" y2="180" stroke="#EA580C" stroke-width="3" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-140" y="-35" width="280" height="30" rx="15" fill="#EA580C" fill-opacity="0.18" stroke="#EA580C" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FB923C" letter-spacing="1.5">CONSTRUCTION EQUIPMENT</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Mixers, Compactors &amp; Scaffolding</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

