<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#162447" />
    </linearGradient>
    <radialGradient id="softboxGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#lightBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#softboxGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Studio Video Lighting Panel & Stand -->
  <g transform="translate(230, 80)">
    <!-- Light Diffuser Panel Glow -->
    <rect x="80" y="40" width="180" height="220" rx="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="4" filter="drop-shadow(0 0 25px rgba(254, 240, 138, 0.45))" />
    <rect x="95" y="55" width="150" height="190" rx="8" fill="#FFFFFF" fill-opacity="0.9" />

    <!-- Barn Doors -->
    <!-- Top door -->
    <polygon points="80,40 260,40 240,-10 100,-10" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <!-- Bottom door -->
    <polygon points="80,260 260,260 240,310 100,310" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <!-- Left door -->
    <polygon points="80,40 80,260 30,240 30,60" fill="#1E293B" stroke="#334155" stroke-width="3" />
    <!-- Right door -->
    <polygon points="260,40 260,260 310,240 310,60" fill="#1E293B" stroke="#334155" stroke-width="3" />

    <!-- Mount Yoke & Stand -->
    <path d="M 60 150 L 30 150 L 30 310 L 170 310 L 170 330" fill="none" stroke="#64748B" stroke-width="5" />
    <path d="M 280 150 L 310 150 L 310 310 L 170 310" fill="none" stroke="#64748B" stroke-width="5" />
    
    <!-- C-Stand Column & Legs -->
    <rect x="165" y="330" width="10" height="50" fill="#94A3B8" />
    <line x1="170" y1="380" x2="100" y2="410" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
    <line x1="170" y1="380" x2="240" y2="410" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
    <line x1="170" y1="380" x2="170" y2="415" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(400, 475)">
    <rect x="-140" y="-35" width="280" height="30" rx="15" fill="#EAB308" fill-opacity="0.18" stroke="#EAB308" stroke-width="1.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FACC15" letter-spacing="1.5">VIDEO &amp; LIGHTING</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Bi-Color LED Panels &amp; C-Stands</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">RentKart Verified Equipment Category</text>
  </g>
</svg>

