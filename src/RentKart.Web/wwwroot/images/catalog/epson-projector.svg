<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pProjBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="pProjGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pProjBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#pProjGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Epson Projector Illustration -->
  <g transform="translate(180, 110)">
    <!-- Light Beam Cones -->
    <polygon points="120,140 -20,70 -20,210" fill="#38BDF8" fill-opacity="0.12" />
    <polygon points="120,140 0,90 0,190" fill="#2DD4BF" fill-opacity="0.15" />

    <!-- Sleek White/Silver Projector Chassis -->
    <rect x="120" y="85" width="310" height="115" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3" />
    <rect x="110" y="195" width="330" height="12" rx="4" fill="#090D16" />

    <!-- Lens Optical Assembly -->
    <circle cx="170" cy="142" r="44" fill="#090D16" stroke="#0D9488" stroke-width="4" />
    <circle cx="170" cy="142" r="34" fill="#1E293B" />
    <circle cx="170" cy="142" r="24" fill="#38BDF8" fill-opacity="0.8" />
    <circle cx="170" cy="142" r="10" fill="#FFFFFF" />

    <!-- Vents & Control Buttons -->
    <line x1="240" y1="112" x2="330" y2="112" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="124" x2="330" y2="124" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="136" x2="330" y2="136" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="148" x2="330" y2="148" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="160" x2="330" y2="160" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />

    <circle cx="380" cy="120" r="8" fill="#0284C7" />
    <circle cx="400" cy="120" r="6" fill="#94A3B8" />
    <circle cx="380" cy="140" r="6" fill="#94A3B8" />
    <circle cx="400" cy="140" r="6" fill="#94A3B8" />

    <!-- Feet -->
    <rect x="150" y="205" width="30" height="15" rx="3" fill="#334155" />
    <rect x="360" y="205" width="30" height="15" rx="3" fill="#334155" />
  </g>

  <!-- Title & Specs -->
  <g transform="translate(400, 475)">
    <rect x="-135" y="-35" width="270" height="28" rx="14" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1.5" />
    <text x="0" y="-16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">EPSON 3LCD WIRELESS PRO</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Epson Pro EX9240 Full HD Projector</text>
    <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">4000 Lumens • 1080p Wireless • HDMI &amp; Screen Mirroring</text>
  </g>
</svg>

