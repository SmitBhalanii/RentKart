<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pCamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="pCamGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pLensReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pCamBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#pCamGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <g transform="translate(160, 100)">
    <!-- Hotshoe & EVF -->
    <path d="M 190 70 L 225 35 L 265 35 L 300 70 Z" fill="#0B132B" stroke="#475569" stroke-width="3" />
    <rect x="235" y="25" width="20" height="10" rx="2" fill="#E2E8F0" />

    <!-- Camera Body -->
    <rect x="50" y="70" width="380" height="230" rx="22" fill="#090D16" stroke="#334155" stroke-width="4" />
    
    <!-- Grip Texture -->
    <path d="M 50 90 C 25 110 20 180 32 270 C 38 295 50 300 70 300 L 70 90 Z" fill="#161F30" stroke="#334155" stroke-width="3" />
    <circle cx="95" cy="55" r="9" fill="#E2E8F0" />
    
    <!-- Dials -->
    <rect x="345" y="52" width="45" height="18" rx="4" fill="#334155" />
    <rect x="300" y="56" width="35" height="14" rx="3" fill="#334155" />

    <!-- Lens Ring & Barrel -->
    <circle cx="245" cy="185" r="115" fill="#161F30" stroke="#475569" stroke-width="4" />
    <circle cx="245" cy="185" r="95" fill="#0B132B" stroke="#0D9488" stroke-width="4" />
    
    <!-- Lens Elements -->
    <circle cx="245" cy="185" r="70" fill="url(#pLensReflect)" />
    <ellipse cx="230" cy="165" rx="32" ry="16" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 230 165)" />

    <!-- Alpha Brand Badge & Lens Release -->
    <circle cx="345" cy="235" r="8" fill="#EF4444" />
    <rect x="365" y="90" width="48" height="18" rx="4" fill="#EA580C" />
    <text x="389" y="103" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">α7 IV</text>
  </g>

  <!-- Title & Specs -->
  <g transform="translate(400, 475)">
    <rect x="-120" y="-35" width="240" height="28" rx="14" fill="#0D9488" fill-opacity="0.2" stroke="#0D9488" stroke-width="1.5" />
    <text x="0" y="-16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#2DD4BF" letter-spacing="1">SONY FULL-FRAME HYBRID</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Sony Alpha a7 IV Mirrorless Camera</text>
    <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">33MP Exmor R • 4K 60p 10-Bit • Dual SD Slots</text>
  </g>
</svg>

