<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pLensBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="pLensGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pLensBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#pLensGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Lens Profile Illustration -->
  <g transform="translate(230, 80)">
    <!-- Lens Hood -->
    <path d="M 60 50 L 280 50 L 260 110 L 80 110 Z" fill="#090D16" stroke="#334155" stroke-width="3" />

    <!-- Red Ring (Canon L Series) -->
    <rect x="80" y="110" width="180" height="8" fill="#DC2626" />

    <!-- Front Element / Focus Ring -->
    <rect x="80" y="118" width="180" height="60" fill="#161F30" stroke="#334155" stroke-width="2" />
    <line x1="90" y1="130" x2="250" y2="130" stroke="#334155" stroke-width="4" stroke-dasharray="8 4" />
    <line x1="90" y1="150" x2="250" y2="150" stroke="#334155" stroke-width="4" stroke-dasharray="8 4" />

    <!-- Zoom Ring (Ribbed) -->
    <rect x="85" y="178" width="170" height="80" fill="#090D16" stroke="#334155" stroke-width="2" />
    <line x1="95" y1="195" x2="245" y2="195" stroke="#475569" stroke-width="3" stroke-dasharray="6 3" />
    <line x1="95" y1="215" x2="245" y2="215" stroke="#475569" stroke-width="3" stroke-dasharray="6 3" />
    <line x1="95" y1="235" x2="245" y2="235" stroke="#475569" stroke-width="3" stroke-dasharray="6 3" />

    <!-- Distance Scale Window -->
    <rect x="130" y="265" width="80" height="24" rx="4" fill="#020617" stroke="#64748B" stroke-width="2" />
    <text x="170" y="281" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#2DD4BF" text-anchor="middle">24 - 70mm</text>

    <!-- Metal Mount Base -->
    <path d="M 95 295 L 245 295 L 235 340 L 105 340 Z" fill="#64748B" stroke="#94A3B8" stroke-width="3" />
    <rect x="135" y="340" width="70" height="8" rx="2" fill="#E2E8F0" />
  </g>

  <!-- Title & Specs -->
  <g transform="translate(400, 475)">
    <rect x="-110" y="-35" width="220" height="28" rx="14" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5" />
    <text x="0" y="-16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F87171" letter-spacing="1">CANON L-SERIES PRO</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Canon RF 24-70mm f/2.8L IS USM</text>
    <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">f/2.8 Constant Aperture • 5-Stop IS • Nano USM</text>
  </g>
</svg>

