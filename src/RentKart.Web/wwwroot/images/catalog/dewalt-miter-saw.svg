<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pSawBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="pSawGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pSawBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#pSawGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- DeWalt Yellow Sliding Miter Saw Illustration -->
  <g transform="translate(180, 90)">
    <!-- Aluminum Base & Miter Table -->
    <rect x="20" y="270" width="400" height="40" rx="6" fill="#64748B" stroke="#94A3B8" stroke-width="3" />
    <polygon points="170,270 270,270 290,310 150,310" fill="#475569" />
    <!-- Miter Degree Scale & Detent Handle -->
    <line x1="220" y1="310" x2="220" y2="355" stroke="#EAB308" stroke-width="12" stroke-linecap="round" />
    <circle cx="220" cy="360" r="14" fill="#090D16" />

    <!-- Dual Sliding Rails -->
    <line x1="120" y1="160" x2="340" y2="160" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round" />
    <line x1="120" y1="185" x2="340" y2="185" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round" />

    <!-- Circular Blade Guard (DeWalt Industrial Yellow) -->
    <circle cx="220" cy="180" r="85" fill="#EAB308" stroke="#CA8A04" stroke-width="4" />
    <!-- Lower Clear Guard Silhouette -->
    <path d="M 135 180 A 85 85 0 0 0 305 180 Z" fill="#FEF08A" fill-opacity="0.5" stroke="#FACC15" stroke-width="2" />

    <!-- Motor Housing -->
    <rect x="240" y="115" width="120" height="75" rx="12" fill="#EAB308" stroke="#090D16" stroke-width="3" />
    <rect x="330" y="130" width="40" height="45" rx="6" fill="#090D16" />

    <!-- D-Handle & Trigger Switch -->
    <path d="M 210 95 L 210 40 L 150 40 L 150 95" fill="none" stroke="#090D16" stroke-width="16" stroke-linejoin="round" />
    <rect x="175" y="45" width="25" height="12" rx="3" fill="#DC2626" />
  </g>

  <!-- Title & Specs -->
  <g transform="translate(400, 475)">
    <rect x="-135" y="-35" width="270" height="28" rx="14" fill="#EAB308" fill-opacity="0.2" stroke="#EAB308" stroke-width="1.5" />
    <text x="0" y="-16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FACC15" letter-spacing="1">PRECISION COMPOUND MITER</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">DeWalt 12" Sliding Compound Miter Saw</text>
    <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">15 Amp Motor • Double-Bevel • Cutline Laser Guide</text>
  </g>
</svg>

