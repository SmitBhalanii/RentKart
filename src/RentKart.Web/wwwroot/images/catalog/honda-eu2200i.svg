<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pHonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="pHonGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pHonBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#pHonGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Honda Red Inverter Generator Illustration -->
  <g transform="translate(180, 100)">
    <!-- Carry Handle Top -->
    <path d="M 130 65 L 310 65 L 290 40 L 150 40 Z" fill="#090D16" stroke="#334155" stroke-width="3" />

    <!-- Red Enclosure Body -->
    <rect x="60" y="65" width="320" height="235" rx="28" fill="#DC2626" stroke="#EF4444" stroke-width="4" />
    
    <!-- Recoil Start / Side Grille -->
    <circle cx="150" cy="180" r="52" fill="#090D16" stroke="#991B1B" stroke-width="4" />
    <circle cx="150" cy="180" r="22" fill="#161F30" />
    <line x1="145" y1="180" x2="155" y2="180" stroke="#F87171" stroke-width="4" />

    <!-- Control Panel Inset -->
    <rect x="240" y="105" width="120" height="155" rx="12" fill="#090D16" stroke="#334155" stroke-width="3" />
    
    <!-- 230V Indian standard sockets -->
    <circle cx="270" cy="145" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <circle cx="266" cy="143" r="2.5" fill="#FFFFFF" />
    <circle cx="274" cy="143" r="2.5" fill="#FFFFFF" />
    <circle cx="270" cy="151" r="3" fill="#FFFFFF" />

    <circle cx="315" cy="145" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <circle cx="311" cy="143" r="2.5" fill="#FFFFFF" />
    <circle cx="319" cy="143" r="2.5" fill="#FFFFFF" />
    <circle cx="315" cy="151" r="3" fill="#FFFFFF" />

    <!-- Status LEDs -->
    <circle cx="265" cy="190" r="4" fill="#10B981" />
    <circle cx="285" cy="190" r="4" fill="#F59E0B" />
    <circle cx="305" cy="190" r="4" fill="#EF4444" />

    <!-- Eco Throttle Switch -->
    <rect x="265" y="210" width="24" height="14" rx="3" fill="#EF4444" />
    <text x="277" y="221" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">ECO</text>
    
    <rect x="300" y="210" width="40" height="14" rx="3" fill="#334155" />

    <!-- Feet -->
    <rect x="90" y="300" width="55" height="18" rx="5" fill="#090D16" />
    <rect x="295" y="300" width="55" height="18" rx="5" fill="#090D16" />
  </g>

  <!-- Title & Specs -->
  <g transform="translate(400, 475)">
    <rect x="-135" y="-35" width="270" height="28" rx="14" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5" />
    <text x="0" y="-16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F87171" letter-spacing="1">HONDA SUPER QUIET INVERTER</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Honda EU2200i Portable Inverter Generator</text>
    <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">2200W Peak • 48 dB Ultra-Quiet • Clean Sine Wave</text>
  </g>
</svg>

