<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pMixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="pMixGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pMixBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#pMixGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Concrete Mixer Illustration -->
  <g transform="translate(200, 90)">
    <!-- Tubular Frame -->
    <line x1="80" y1="280" x2="180" y2="170" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    <line x1="280" y1="280" x2="180" y2="170" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    <line x1="80" y1="280" x2="280" y2="280" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    
    <!-- Heavy Duty Solid Rubber Wheels -->
    <circle cx="80" cy="285" r="32" fill="#090D16" stroke="#EA580C" stroke-width="5" />
    <circle cx="80" cy="285" r="10" fill="#CBD5E1" />

    <!-- Tilted Mixing Drum -->
    <g transform="rotate(22 210 160)">
      <path d="M 120 180 C 120 240 260 240 260 180 L 260 120 L 120 120 Z" fill="#EA580C" stroke="#C2410C" stroke-width="4" />
      <polygon points="120,120 260,120 220,55 160,55" fill="#F97316" stroke="#C2410C" stroke-width="4" />
      <ellipse cx="190" cy="55" rx="30" ry="10" fill="#090D16" stroke="#EA580C" stroke-width="3" />
      <line x1="115" y1="150" x2="265" y2="150" stroke="#090D16" stroke-width="10" stroke-dasharray="12 6" />
    </g>

    <!-- 0.75HP Motor Box -->
    <rect x="240" y="160" width="60" height="60" rx="8" fill="#161F30" stroke="#475569" stroke-width="3" />
    <!-- Tipping Handwheel -->
    <circle cx="325" cy="180" r="24" fill="none" stroke="#EA580C" stroke-width="5" />
    <line x1="325" y1="156" x2="325" y2="204" stroke="#EA580C" stroke-width="4" />
    <line x1="301" y1="180" x2="349" y2="180" stroke="#EA580C" stroke-width="4" />
  </g>

  <!-- Title & Specs -->
  <g transform="translate(400, 475)">
    <rect x="-135" y="-35" width="270" height="28" rx="14" fill="#EA580C" fill-opacity="0.2" stroke="#EA580C" stroke-width="1.5" />
    <text x="0" y="-16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FB923C" letter-spacing="1">COMMERCIAL SITE MASONRY</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Heavy-Duty Portable Concrete Mixer (140L)</text>
    <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">0.75 HP Motor • Dual Mixing Blades • Transport Wheels</text>
  </g>
</svg>

