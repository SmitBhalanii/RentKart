<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pGimBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="pGimGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pGimBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#pGimGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- 3-Axis Gimbal Stabilizer Silhouette -->
  <g transform="translate(230, 80)">
    <!-- Camera Mounting Plate & Arms -->
    <rect x="120" y="45" width="140" height="18" rx="4" fill="#0D9488" />
    <rect x="150" y="30" width="80" height="15" rx="3" fill="#E2E8F0" />

    <!-- Roll Axis Motor -->
    <circle cx="280" cy="90" r="26" fill="#090D16" stroke="#0D9488" stroke-width="3" />
    <path d="M 260 55 L 280 90 L 250 160" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" />

    <!-- Tilt Axis Arm -->
    <path d="M 100 55 L 100 130 L 220 160" fill="none" stroke="#334155" stroke-width="10" stroke-linejoin="round" />
    <circle cx="100" cy="130" r="24" fill="#090D16" stroke="#2DD4BF" stroke-width="3" />

    <!-- Pan Axis Motor -->
    <circle cx="170" cy="205" r="30" fill="#090D16" stroke="#0D9488" stroke-width="4" />
    
    <!-- Grip & Battery Handle -->
    <path d="M 155 235 L 185 235 L 180 345 L 160 345 Z" fill="#090D16" stroke="#334155" stroke-width="3" />
    <!-- Grip Texture -->
    <line x1="162" y1="260" x2="178" y2="260" stroke="#475569" stroke-width="2" />
    <line x1="162" y1="280" x2="178" y2="280" stroke="#475569" stroke-width="2" />
    <line x1="162" y1="300" x2="178" y2="300" stroke="#475569" stroke-width="2" />

    <!-- OLED Touchscreen & Joystick -->
    <rect x="160" y="240" width="20" height="28" rx="3" fill="#020617" stroke="#2DD4BF" stroke-width="1.5" />
    <circle cx="170" cy="285" r="5" fill="#EF4444" />

    <!-- Tripod Legs (Spread at Base) -->
    <line x1="170" y1="345" x2="110" y2="385" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
    <line x1="170" y1="345" x2="230" y2="385" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
    <line x1="170" y1="345" x2="170" y2="390" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Title & Specs -->
  <g transform="translate(400, 475)">
    <rect x="-120" y="-35" width="240" height="28" rx="14" fill="#0D9488" fill-opacity="0.2" stroke="#0D9488" stroke-width="1.5" />
    <text x="0" y="-16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#2DD4BF" letter-spacing="1">DJI CINEMATIC GIMBAL</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">DJI RS 3 Pro 3-Axis Gimbal Stabilizer</text>
    <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">4.5kg Payload • Carbon Fiber • Automated Axis Locks</text>
  </g>
</svg>

