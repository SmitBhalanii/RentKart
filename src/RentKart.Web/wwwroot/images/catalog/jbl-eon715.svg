<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pJblBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="pJblGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pJblBg)" />
  <circle cx="400" cy="270" r="260" fill="url(#pJblGlow)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Pair of Active Powered PA Speakers -->
  <g transform="translate(190, 80)">
    <!-- Speaker 1 (Left) -->
    <g transform="translate(0, 0)">
      <polygon points="30,20 180,20 195,310 15,310" fill="#090D16" stroke="#334155" stroke-width="3" />
      <polygon points="40,30 170,30 182,300 28,300" fill="#161F30" stroke="#475569" stroke-width="2" />
      <rect x="80" y="55" width="50" height="35" rx="5" fill="#020617" stroke="#A855F7" stroke-width="2" />
      <circle cx="105" cy="185" r="55" fill="#020617" stroke="#334155" stroke-width="3" />
      <circle cx="105" cy="185" r="38" fill="#090D16" stroke="#A855F7" stroke-width="2" stroke-dasharray="4 2" />
      <circle cx="105" cy="185" r="12" fill="#A855F7" />
      <circle cx="105" cy="285" r="3" fill="#10B981" />
    </g>

    <!-- Speaker 2 (Right) -->
    <g transform="translate(210, 0)">
      <polygon points="30,20 180,20 195,310 15,310" fill="#090D16" stroke="#334155" stroke-width="3" />
      <polygon points="40,30 170,30 182,300 28,300" fill="#161F30" stroke="#475569" stroke-width="2" />
      <rect x="80" y="55" width="50" height="35" rx="5" fill="#020617" stroke="#A855F7" stroke-width="2" />
      <circle cx="105" cy="185" r="55" fill="#020617" stroke="#334155" stroke-width="3" />
      <circle cx="105" cy="185" r="38" fill="#090D16" stroke="#A855F7" stroke-width="2" stroke-dasharray="4 2" />
      <circle cx="105" cy="185" r="12" fill="#A855F7" />
      <circle cx="105" cy="285" r="3" fill="#10B981" />
    </g>
  </g>

  <!-- Title & Specs -->
  <g transform="translate(400, 475)">
    <rect x="-135" y="-35" width="270" height="28" rx="14" fill="#A855F7" fill-opacity="0.2" stroke="#A855F7" stroke-width="1.5" />
    <text x="0" y="-16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#C084FC" letter-spacing="1">JBL PROFESSIONAL PA SYSTEM</text>
    <text x="0" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">JBL EON715 15" 1300W Powered PA Pair</text>
    <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">1300W Peak Class-D • Bluetooth 5.0 • 3-Channel Digital Mixer</text>
  </g>
</svg>

