<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="398" height="298" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Center Icon Graphic -->
  <g transform="translate(150, 80)">
    <circle cx="50" cy="50" r="46" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(15, 23, 42, 0.06))" />
    <circle cx="50" cy="50" r="44" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 2" />
    
    <!-- Camera / Equipment Icon -->
    <g transform="translate(26, 26)" stroke="url(#iconGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 4h3l2 3h8l2-3h3a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/>
      <circle cx="15" cy="14" r="5"/>
    </g>
  </g>

  <!-- Brand Label & Prompt -->
  <text x="200" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#0f172a" letter-spacing="0.3">
    RentKart Equipment
  </text>
  <text x="200" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#64748b">
    Verified Store Rental Listing
  </text>
</svg>

